<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goose · 迁移控制台</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#10151d;color:#e1e9f3}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;border-bottom:1px solid #334155;display:flex;gap:24px;align-items:center}h1{font-size:19px;margin:0}button,input,select{font:inherit;color:inherit;background:#1e293b;border:1px solid #475569;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{border-color:#5eead4}#summary{color:#94a3b8;flex:1}main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 78px)}aside{border-right:1px solid #334155;overflow:auto;padding:16px}#search{width:100%;margin-bottom:12px}.task{display:block;width:100%;text-align:left;margin:5px 0;padding:12px}.task.selected{border-color:#5eead4;background:#17363a}.muted{color:#94a3b8;font-size:12px}.badge{color:#5eead4}section{display:flex;flex-direction:column;min-width:0;padding:20px}#detail{white-space:pre-wrap;line-height:1.7}#events{overflow:auto;flex:1;margin-top:15px}.event{border-top:1px solid #283447;padding:12px 0}.event summary{overflow-wrap:anywhere}.event pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;font:13px/1.65 ui-monospace,monospace}.toolbar{display:flex;align-items:center;gap:12px;margin:12px 0}#error{color:#fca5a5}dialog{background:#17212e;color:inherit;border:1px solid #475569;border-radius:10px;max-width:95vw;width:720px}dialog::backdrop{background:#0009}table{width:100%;border-spacing:8px}td input{width:100%}#empty{margin:30px;color:#94a3b8}@media(max-width:750px){main{grid-template-columns:240px 1fr}header{flex-wrap:wrap}}
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}header{flex:none}main{flex:1;min-height:0;height:auto}section{min-height:0}.toolbar{flex-wrap:wrap}.toolbar button{white-space:nowrap}#events{min-height:0}dialog input{min-width:0}@media(max-width:750px){main{display:flex;flex-direction:column}aside{height:185px;flex:none;border-right:0;border-bottom:1px solid #334155;padding:10px 16px}section{flex:1;padding:14px}header{padding:14px;gap:10px}#detail{font-size:12px;max-height:125px;overflow:auto}.toolbar{gap:8px}}
</style>
<header><h1>Goose / 迁移控制台</h1><span id="summary">读取状态…</span><button id="configure">模型分配</button></header>
<main><aside><input id="search" placeholder="筛选任务 / 状态"><div id="tasks"></div></aside><section><div id="detail">选择任务查看当前阶段和输出</div><div class="toolbar"><button id="replay">从头回放</button><button id="allWorkers">多 worker 时间线</button><select id="filter"><option value="all">全部内容</option><option value="agent">输出</option><option value="thinking">Thinking</option><option value="tool">工具调用</option><option value="tool_result">工具返回</option><option value="stderr">错误</option></select><label><input id="autoscroll" type="checkbox" checked> 跟随输出</label><span class="muted">仅显示最近 300 段，每段最多 64K 字符；完整记录保留在 runs 日志。</span><span id="error"></span></div><div id="events"><div id="empty">worker 保持原有状态；打开看板不会启动任务。</div></div></section></main>
<dialog id="config"><h2>模型分配</h2><p>Goose 直接使用现有 provider。保存后从下一阶段生效，当前请求保留原模型。</p><table><thead><tr><th>角色</th><th>Provider ID</th><th>Model</th></tr></thead><tbody id="roles"></tbody></table><p class="muted">唯一配置：.goose/agent-config.json · 此处不保存 API 密钥。</p><p id="configError"></p><button id="save">保存</button> <button id="close">关闭</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let tasks=[],selected=null,cursor=-1,run=null,epoch=0,configuration=null,lastTaskView="",workerCursors={};
async function api(path,options){const r=await fetch(path,options);const data=await r.json();if(!r.ok)throw Error(data.error||r.statusText);return data;}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function renderTasks(){const q=$('search').value.toLowerCase();const fingerprint=JSON.stringify([q,selected,tasks.map(t=>[t.id,t.state,t.round])]);if(fingerprint===lastTaskView)return;lastTaskView=fingerprint;$('tasks').replaceChildren();const ordered=[...tasks].sort((a,b)=>(b.state==='RUNNING')-(a.state==='RUNNING')||a.id.localeCompare(b.id));for(const t of ordered){if(!(t.id+' '+t.state).toLowerCase().includes(q))continue;const b=text('button',t.id,'task'+(t.id===selected?' selected':''));b.append(text('div',`${t.state} · 第 ${t.round} 轮`,'muted'));b.onclick=()=>{selected=t.id;cursor=-1;run=null;epoch++;clearEvents();renderTasks();renderDetail();};$('tasks').append(b);}}
function renderDetail(){if(selected==='*'){$('detail').textContent='多 worker 时间线 · 各任务独立游标 · 按事件时间排序';return;}const t=tasks.find(x=>x.id===selected);if(!t)return;const l=t.live||{},a=l.last_activity||{};$('detail').textContent=`${t.id}  ·  ${t.state}\n阶段 ${l.phase||'—'} · 请求模型 ${l.provider||'未知'} / ${l.model||'历史记录未提供'} · 配置 ${l.config_revision||'—'}\n最近活动 ${a.time||'—'} · ${String(a.message||'').slice(0,220)}\n${t.error||''}${(t.waiting_on||[]).length?'\n依赖：'+t.waiting_on.join(', '):''}`;}
const streamBoxes=new Map(), MAX_EVENTS=300, MAX_TEXT=65536;
function clearEvents(){streamBoxes.clear();$('events').replaceChildren();}
function showEvent(e){
 if(e.kind==='heartbeat')return;
 const task=e.task||selected, key=JSON.stringify([task,e.run,e.attempt,e.phase,e.round]);
 const previous=streamBoxes.get(key), streaming=['agent','thinking'].includes(e.kind);
 let box=previous&&previous.isConnected&&streaming&&previous.dataset.kind===e.kind&&previous.streamId===(e.stream_id||null)?previous:null;
 if(!box){
  box=document.createElement('div');box.className='event';box.dataset.kind=e.kind;box.streamId=e.stream_id||null;
  box.dataset.order=(e.time||'')+' '+task+' '+String(e.cursor||0).padStart(14,'0');
  box.append(text('div',`${e.time||''} · ${task} · ${e.phase||''}:${e.round||0} · ${e.kind}`,'muted'));
  box.output=document.createTextNode('');const body=document.createElement('pre');body.append(box.output);
  if(['tool','tool_result','thinking'].includes(e.kind)){const d=document.createElement('details');box.preview=text('summary','');d.append(box.preview,body);box.append(d);}else box.append(body);
  $('events').append(box);streamBoxes.set(key,box);
 }
 const value=String(e.message||'');box.output.appendData(value);
 if(box.output.length>MAX_TEXT)box.output.deleteData(0,box.output.length-MAX_TEXT);
 if(box.preview)box.preview.textContent=box.output.data.replace(/\n/g,' ').slice(0,140)||'空内容';
 box.hidden=$('filter').value!=='all'&&$('filter').value!==e.kind;
}
function trimEvents(){const panel=$('events');while(panel.children.length>MAX_EVENTS)panel.firstElementChild.remove();for(const [key,box] of streamBoxes)if(!box.isConnected)streamBoxes.delete(key);}
async function pollAll(generation){const pending=[];for(const t of tasks.filter(t=>t.has_run)){const saved=workerCursors[t.id]||{cursor:-1,run:null};const page=await api('/api/events?task='+encodeURIComponent(t.id)+'&cursor='+saved.cursor+(saved.run?'&run='+encodeURIComponent(saved.run):''));if(generation!==epoch)return;workerCursors[t.id]={cursor:page.next,run:page.run};for(const e of page.events)pending.push({...e,task:t.id});}pending.sort((a,b)=>String(a.time).localeCompare(String(b.time))||a.cursor-b.cursor);pending.forEach(showEvent);const panel=$('events');if(pending.length){const ordered=[...panel.children].sort((a,b)=>a.dataset.order.localeCompare(b.dataset.order));ordered.forEach(e=>panel.append(e));trimEvents();}if($('autoscroll').checked)panel.scrollTop=panel.scrollHeight;}
async function poll(){try{const data=await api('/api/status');tasks=data.tasks;$('summary').textContent=`${data.scheduler||'未启动'} · ${tasks.length} 任务 · ${data.counts.INTEGRATED||0} 已集成 · 发布 ${data.publication||'—'}`;renderTasks();renderDetail();if(selected==='*'){await pollAll(epoch);}else if(selected){const id=selected,generation=epoch;const page=await api('/api/events?task='+encodeURIComponent(id)+'&cursor='+cursor+(run?'&run='+encodeURIComponent(run):''));if(generation===epoch){if(page.reset)clearEvents();cursor=page.next;run=page.run;page.events.forEach(showEvent);trimEvents();if($('autoscroll').checked)$('events').scrollTop=$('events').scrollHeight;}}$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{setTimeout(poll,1000);}}
$('replay').onclick=()=>{cursor=0;run=null;epoch++;workerCursors={};for(const t of tasks)workerCursors[t.id]={cursor:0,run:null};clearEvents();};$('allWorkers').onclick=()=>{selected='*';cursor=-1;run=null;epoch++;workerCursors={};clearEvents();renderDetail();renderTasks();};$('search').oninput=renderTasks;$('filter').onchange=()=>{for(const e of $('events').children)e.hidden=$('filter').value!=='all'&&e.dataset.kind!==$('filter').value;};
$('configure').onclick=async()=>{try{configuration=await api('/api/config');$('roles').replaceChildren();for(const [role,v] of Object.entries(configuration.config.roles)){const tr=document.createElement('tr');tr.append(text('td',role));for(const key of ['provider','model']){const td=document.createElement('td'),input=document.createElement('input');input.value=v[key];input.dataset.role=role;input.dataset.key=key;input.setAttribute('aria-label',role+' '+key);td.append(input);tr.append(td);}$('roles').append(tr);}$('configError').textContent='';$('config').showModal();}catch(e){$('error').textContent=e.message;}};
$('save').onclick=async()=>{try{const value=JSON.parse(JSON.stringify(configuration.config));for(const i of $('roles').querySelectorAll('input'))value.roles[i.dataset.role][i.dataset.key]=i.value.trim();const r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':configuration.token},body:JSON.stringify({config:value,revision:configuration.revision})});configuration.revision=r.revision;configuration.config=value;$('configError').textContent='已保存。下一阶段使用新配置。';}catch(e){$('configError').textContent=e.message;}};$('close').onclick=()=>$('config').close();poll();
</script></html>
