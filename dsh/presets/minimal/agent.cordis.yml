# Minimal Preset Composition
- id: persona
  name: "@deepseek-ai/dsh-persona"
  config:
    text: "You are a helpful software engineer assistant."
    complete: true
    includeRuntimeContext: false

- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: "@deepseek-ai/dsh-terminal"
    - id: terminal-bash
      name: "@deepseek-ai/dsh-terminal-bash"
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
    - id: persistent-bash
      name: "@deepseek-ai/dsh-tool-pwsh-persistent"
      disabled: !!js process.platform === 'win32'
      config:
        tool_name: bash
        timeoutMs: 300000
    - id: terminal-pwsh
      name: "@deepseek-ai/dsh-terminal-bash"
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000
    - id: persistent-pwsh
      name: "@deepseek-ai/dsh-tool-pwsh-persistent"
      disabled: !!js process.platform !== 'win32'
      config:
        tool_name: pwsh
        timeoutMs: 300000

- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: "@deepseek-ai/dsh-fs-local"
      config:
        cwd: "."
    - id: str-replace-editor
      name: "@deepseek-ai/dsh-tool-str-replace-editor"
      config:
        maxOutputChars: 16000
