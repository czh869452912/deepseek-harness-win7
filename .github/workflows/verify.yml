name: Verify Python 3.8 portable
on:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Optional frozen product commit to qualify with this workflow'
        required: false
        type: string
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Use Windows materialized Git symlink inputs
        run: |
          git config --global core.symlinks false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          submodules: recursive
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Bootstrap gate Python dependencies
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install pip==25.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual Source materialized input identity
        run: |
          .venv/Scripts/python.exe -c "from scripts.agent_dependencies_oracle import source_inputs, ROOT; print('Actual Source guarded inputs:', len(source_inputs(ROOT / 'reference')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Electron22 Node16 test runtime
        run: |
          $identity = (Get-Content -Encoding utf8 scripts/desktop-tool-inputs.json | ConvertFrom-Json).electron
          $tools = Join-Path $env:GITHUB_WORKSPACE ('.goose/tools/electron-' + $identity.version + '-win32-' + $identity.architecture)
          New-Item -ItemType Directory -Path $tools -ErrorAction Stop | Out-Null
          $archive = Join-Path $tools ([IO.Path]::GetFileName($identity.url))
          Invoke-WebRequest -Uri $identity.url -OutFile $archive -ErrorAction Stop
          if ((Get-Item -LiteralPath $archive).Length -ne $identity.bytes) { throw 'Pinned Electron archive size differs' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $identity.sha256) { throw 'Pinned Electron archive SHA256 differs' }
          $runtime = Join-Path $tools 'runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -ErrorAction Stop
          $env:ELECTRON_RUN_AS_NODE = '1'
          & (Join-Path $runtime 'electron.exe') -e "if(process.versions.electron!=='22.3.27'||process.versions.node!=='16.17.1')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron22 Node16 runtime identity differs' }
      - name: Prepare pinned inputs, build, and verify
        id: gate
        run: |
          $releaseTemp = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ("dsh-release-temp-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $releaseTemp -ErrorAction Stop | Out-Null
          $env:TEMP = $releaseTemp
          $env:TMP = $releaseTemp
          $browser = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          if (-not (Test-Path -LiteralPath $browser)) { throw 'Required Chromium observer is missing' }
          python scripts/browser108_gate.py --prepare .goose/tools/chromium108
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browser108 = (Resolve-Path .goose/tools/chromium108/chrome-win/chrome.exe).Path
          .venv/Scripts/python.exe scripts/verify_release.py --prepare --browser $browser --browser108 $browser108
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content -Encoding utf8 .goose/out/release-gate/summary.json | ConvertFrom-Json -AsHashtable
          if ($receipt.result -ne 'passed' -or $receipt.publishable -ne $true) { throw 'Candidate is not publishable' }
          $digest = (Get-FileHash -LiteralPath $receipt.archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $receipt.archive_sha256) { throw 'Verified archive changed before upload' }
          "archive=$($receipt.archive)" >> $env:GITHUB_OUTPUT
      - name: Package diagnostics without following fixture links
        if: always()
        run: |
          python scripts/package_release_diagnostics.py --source .goose/out/release-gate --archive .goose/out/release-diagnostics.zip
          $diagnosticExit = $LASTEXITCODE
          if ($diagnosticExit -ne 0) {
            python scripts/package_release_diagnostics.py --source .goose/out/release-gate --archive .goose/out/release-primary-diagnostics.zip --reports-only
            exit $diagnosticExit
          }
      - name: Preserve raw observations and regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diagnostics
          path: |
            .goose/out/release-diagnostics.zip
            .goose/out/release-primary-diagnostics.zip
          if-no-files-found: error
      - name: Upload verified portable
        uses: actions/upload-artifact@v4
        with:
          name: verified-portable
          path: ${{ steps.gate.outputs.archive }}
          if-no-files-found: error
