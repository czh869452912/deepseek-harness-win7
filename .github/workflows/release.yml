name: Release verified portable
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-portable
          path: dist
      - name: Publish the exact archive that passed verification
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-win7-portable-v*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
