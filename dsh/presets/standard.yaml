# Standard Mode (标准模式 / Standard Preset)
# Full coding agent composition: engineering suite, standard persona, plan mode, goal mode, compaction, todo, ask_user, search, and skills.

- id: persona
  name: "@deepseek-ai/dsh-persona"
  config:
    text: "You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}."

- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    maxBytes: 65536

- id: fs-local
  name: "@deepseek-ai/dsh-fs-local"
  config:
    cwd: "."

- id: str-replace-editor
  name: "@deepseek-ai/dsh-tool-str-replace-editor"
  config:
    maxOutputChars: 16000

- id: persistent-pwsh
  name: "@deepseek-ai/dsh-tool-pwsh-persistent"
  disabled: sys.platform != 'win32'
  config:
    tool_name: pwsh
    timeoutMs: 300000

- id: persistent-bash
  name: "@deepseek-ai/dsh-tool-pwsh-persistent"
  disabled: sys.platform == 'win32'
  config:
    tool_name: bash
    timeoutMs: 300000

- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  config:
    globMaxResults: 100
    grepMaxMatches: 250

- id: tool-ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"

- id: tool-todo
  name: "@deepseek-ai/dsh-tool-todo"
  config:
    allowParallelInProgress: true

- id: plan-mode
  name: "@deepseek-ai/dsh-plan-mode"

- id: tool-goal
  name: "@deepseek-ai/dsh-tool-goal"

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"

- id: tool-result-pruner
  name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
