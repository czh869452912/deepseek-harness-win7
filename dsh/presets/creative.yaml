# Creative Mode (创造模式) Preset
# Full standard capabilities plus Skill system and Cordis plugin inspection tools.

- id: persona
  name: "@deepseek-ai/dsh-persona"
  config:
    text: You are an expert AI engineer proficient in Cordis architecture.

- id: fs-local
  name: "@deepseek-ai/dsh-fs-local"
  config:
    cwd: "."

- id: str-replace-editor
  name: "@deepseek-ai/dsh-tool-str-replace-editor"
  config:
    maxOutputChars: 16000

- id: persistent-pwsh
  name: "@deepseek-ai/dsh-tool-pwsh-persistent"
  disabled: sys.platform != 'win32'
  config:
    tool_name: pwsh
    timeoutMs: 300000

- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"

- id: cordis-manager
  name: "@deepseek-ai/dsh-cordis-manager"
  config:
    enable_inspection: true
