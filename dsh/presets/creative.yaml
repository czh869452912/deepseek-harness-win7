# Creative Mode (创造模式 / Cordis Preset)
# Full engineering suite, dual-plane self-modification persona, compaction, todo, ask_user, search, and skills.

- id: persona
  name: "@deepseek-ai/dsh-persona"
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You can read and modify the harness you run on. Its composition is Cordis: every capability is a plugin row in a preset YAML, and an agent preset is mounted for a single session.

      Two planes decide where an edit belongs. The HOST composition holds the registries and anything shared across sessions — persistence, the settings, the model route. An AGENT PRESET holds what one session contributes to those registries: its tools, its persona, its prompt sections.

      Load the `editing-cordis-compositions` skill before writing or changing a composition.

- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    maxBytes: 65536

- id: fs-local
  name: "@deepseek-ai/dsh-fs-local"
  config:
    cwd: "."

- id: str-replace-editor
  name: "@deepseek-ai/dsh-tool-str-replace-editor"
  config:
    maxOutputChars: 16000

- id: persistent-pwsh
  name: "@deepseek-ai/dsh-tool-pwsh-persistent"
  disabled: sys.platform != 'win32'
  config:
    tool_name: pwsh
    timeoutMs: 300000

- id: persistent-bash
  name: "@deepseek-ai/dsh-tool-pwsh-persistent"
  disabled: sys.platform == 'win32'
  config:
    tool_name: bash
    timeoutMs: 300000

- id: tool-fs-search
  name: "@deepseek-ai/dsh-tool-fs-search"
  config:
    globMaxResults: 100
    grepMaxMatches: 250

- id: tool-ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"

- id: tool-todo
  name: "@deepseek-ai/dsh-tool-todo"
  config:
    allowParallelInProgress: true

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"

- id: tool-result-pruner
  name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: cordis-manager
  name: "@deepseek-ai/dsh-cordis-manager"
  config:
    enable_inspection: true

- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"

- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
