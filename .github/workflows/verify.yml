name: Verify Python 3.8 portable
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Prepare pinned inputs, build, and verify
        id: gate
        run: |
          $browser = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (-not (Test-Path -LiteralPath $browser)) { throw 'Required Chromium observer is missing' }
          python scripts/verify_release.py --prepare --browser $browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content -Encoding utf8 .goose/out/release-gate/summary.json | ConvertFrom-Json
          if ($receipt.result -ne 'passed' -or $receipt.publishable -ne $true) { throw 'Candidate is not publishable' }
          $digest = (Get-FileHash -LiteralPath $receipt.archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $receipt.archive_sha256) { throw 'Verified archive changed before upload' }
          "archive=$($receipt.archive)" >> $env:GITHUB_OUTPUT
      - name: Preserve raw observations and regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diagnostics
          path: .goose/out/release-gate/
          include-hidden-files: true
      - name: Upload verified portable
        uses: actions/upload-artifact@v4
        with:
          name: verified-portable
          path: ${{ steps.gate.outputs.archive }}
          if-no-files-found: error
